<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>留学课程内容生成器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 14px;
        }
        
        .content {
            padding: 30px;
        }
        
        .form-group {
            margin-bottom: 24px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }
        
        input[type="text"],
        input[type="password"],
        select,
        textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
            font-family: inherit;
        }
        
        input[type="text"]:focus,
        input[type="password"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        
        .radio-group {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        
        .radio-item {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        
        .radio-item input[type="radio"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #667eea;
        }
        
        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .result {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            border-left: 4px solid #667eea;
            display: none;
        }
        
        .result.show {
            display: block;
        }
        
        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        
        .result-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }
        
        .copy-btn {
            padding: 8px 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .copy-btn:hover {
            background: #5568d3;
        }
        
        .result-content {
            white-space: pre-wrap;
            line-height: 1.8;
            color: #555;
            font-size: 14px;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 40px;
        }
        
        .loading.show {
            display: block;
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .tip {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 24px;
            font-size: 13px;
            color: #856404;
        }
        
        .tip a {
            color: #667eea;
            text-decoration: none;
        }
        
        .tip a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 留学课程内容生成器</h1>
            <p>一键生成小红书/知乎/抖音风格的课程推广内容</p>
        </div>
        
        <div class="content">
            <div class="tip">
                💡 使用前需要准备：DeepSeek API Key（<a href="https://platform.deepseek.com/" target="_blank">点击申请</a>，新用户送 1000 万 token 免费额度）
            </div>
            
            <div class="form-group">
                <label>🔑 API Key</label>
                <input type="password" id="apiKey" placeholder="输入你的 DeepSeek API Key">
            </div>
            
            <div class="form-group">
                <label>📝 内容主题</label>
                <input type="text" id="topic" placeholder="例如：雅思听力技巧、A-level数学选课指南、留学申请时间规划">
            </div>
            
            <div class="form-group">
                <label>🎯 目标平台</label>
                <div class="radio-group">
                    <label class="radio-item">
                        <input type="radio" name="platform" value="小红书" checked>
                        <span>小红书</span>
                    </label>
                    <label class="radio-item">
                        <input type="radio" name="platform" value="知乎">
                        <span>知乎</span>
                    </label>
                    <label class="radio-item">
                        <input type="radio" name="platform" value="抖音">
                        <span>抖音</span>
                    </label>
                </div>
            </div>
            
            <div class="form-group">
                <label>📋 课程类型</label>
                <select id="courseType">
                    <option value="雅思">雅思课程</option>
                    <option value="A-level">A-level 课程</option>
                    <option value="留学申请">留学申请服务</option>
                    <option value="综合">综合（雅思+A-level+申请）</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>✨ 补充要求（可选）</label>
                <textarea id="requirements" placeholder="例如：针对高中生、强调提分效果、包含优惠活动等"></textarea>
            </div>
            
            <button class="btn" id="generateBtn" onclick="generateContent()">🚀 生成内容</button>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>正在生成内容，请稍候...</p>
            </div>
            
            <div class="result" id="result">
                <div class="result-header">
                    <div class="result-title">📄 生成结果</div>
                    <button class="copy-btn" onclick="copyResult()">📋 复制内容</button>
                </div>
                <div class="result-content" id="resultContent"></div>
            </div>
        </div>
    </div>

    <script>
        async function generateContent() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const topic = document.getElementById('topic').value.trim();
            const platform = document.querySelector('input[name="platform"]:checked').value;
            const courseType = document.getElementById('courseType').value;
            const requirements = document.getElementById('requirements').value.trim();
            
            if (!apiKey) {
                alert('请输入 API Key');
                return;
            }
            
            if (!topic) {
                alert('请输入内容主题');
                return;
            }
            
            const btn = document.getElementById('generateBtn');
            const loading = document.getElementById('loading');
            const result = document.getElementById('result');
            
            btn.disabled = true;
            loading.classList.add('show');
            result.classList.remove('show');
            
            const prompt = buildPrompt(platform, topic, courseType, requirements);
            
            try {
                const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: 'deepseek-chat',
                        messages: [
                            {
                                role: 'system',
                                content: '你是一个专业的留学课程营销文案专家，擅长为雅思、A-level和留学申请课程撰写吸引人的推广内容。你需要根据不同平台的特点，生成风格匹配的文案。'
                            },
                            {
                                role: 'user',
                                content: prompt
                            }
                        ],
                        max_tokens: 1500,
                        temperature: 0.8
                    })
                });
                
                const data = await response.json();
                
                if (data.choices && data.choices[0] && data.choices[0].message) {
                    const content = data.choices[0].message.content;
                    document.getElementById('resultContent').textContent = content;
                    result.classList.add('show');
                } else {
                    alert('生成失败：' + (data.error?.message || '未知错误'));
                }
            } catch (error) {
                alert('请求失败：' + error.message);
            } finally {
                btn.disabled = false;
                loading.classList.remove('show');
            }
        }
        
        function buildPrompt(platform, topic, courseType, requirements) {
            const platformStyles = {
                '小红书': `请以小红书风格撰写，要求：
1. 标题用 emoji 开头，吸引眼球
2. 正文分段清晰，每段用 emoji 标记
3. 语气亲切，像朋友分享经验
4. 包含实用干货和具体建议
5. 结尾引导关注或私信咨询
6. 添加 5-8 个相关话题标签（#雅思备考 #留学申请 等）
7. 字数控制在 500-800 字`,
                
                '知乎': `请以知乎回答风格撰写，要求：
1. 开头直接点题，给出核心观点
2. 结构清晰，用数字或小标题分段
3. 内容专业、有深度，包含数据或案例
4. 语气客观理性，避免过度营销
5. 结尾可以委婉引导私信或关注公众号
6. 字数控制在 800-1200 字`,
                
                '抖音': `请以抖音短视频脚本风格撰写，要求：
1. 开头 3 秒必须有强吸引力的 hook（提问、冲突、悬念）
2. 脚本分为：画面描述 + 口播文案
3. 节奏快，每句话简短有力
4. 包含 3-5 个关键信息点
5. 结尾有明确的行动号召（关注、评论、私信）
6. 总时长控制在 45-60 秒（约 200-300 字口播）`
            };
            
            let prompt = `请为${courseType}课程撰写一篇${platform}推广内容。

主题：${topic}

${platformStyles[platform]}`;
            
            if (requirements) {
                prompt += `\n\n补充要求：${requirements}`;
            }
            
            return prompt;
        }
        
        function copyResult() {
            const content = document.getElementById('resultContent').textContent;
            navigator.clipboard.writeText(content).then(() => {
                const btn = event.target;
                const originalText = btn.textContent;
                btn.textContent = '✅ 已复制';
                setTimeout(() => {
                    btn.textContent = originalText;
                }, 2000);
            }).catch(() => {
                alert('复制失败，请手动选择内容复制');
            });
        }
    </script>
</body>
</html>
